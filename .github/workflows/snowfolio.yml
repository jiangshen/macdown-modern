name: Snowfolio native builds

on:
  push:
    paths:
      - 'Packages/**'
      - 'App/**'
      - 'Tools/**'
      - '.github/workflows/snowfolio.yml'
  pull_request:
    paths:
      - 'Packages/**'
      - 'App/**'
      - 'Tools/**'
      - '.github/workflows/snowfolio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-foundations:
    # Native arm64 macOS 27 / Xcode 27 hosted image. See actions/runner-images.
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build, test and verify Apple Silicon output
        run: bash Tools/validate-modernization.sh "$RUNNER_TEMP/snowfolio-validation"
      - name: Check every published CommonMark example
        run: |
          curl --fail --silent --show-error --retry 3 https://spec.commonmark.org/0.31.2/spec.json -o "$RUNNER_TEMP/commonmark-spec.json"
          bash Tools/validate-commonmark.sh "$RUNNER_TEMP/commonmark-spec.json" "$RUNNER_TEMP/snowfolio-commonmark"
      - name: Preserve parser and package validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snowfolio-core-${{ github.sha }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/snowfolio-validation/*.log
            ${{ runner.temp }}/snowfolio-validation/*.txt
            ${{ runner.temp }}/snowfolio-commonmark/*.json
            ${{ runner.temp }}/snowfolio-commonmark/*.log

  native-app:
    runs-on: xcode-27
    # The 19-method native UI suite has reached 20 minutes including artifact upload.
    # Keep per-test waits/assertions unchanged and leave time to preserve results.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install project generator
        run: brew install tuist
      - name: Build native app and run document UI tests
        run: bash Tools/build-snowfolio.sh --test
      - name: Preserve native UI test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snowfolio-native-${{ github.sha }}
          retention-days: 7
          path: |
            Build/Snowfolio/*.log
            Build/Snowfolio/DerivedData/Logs/Test/*.xcresult
