name: Snowfolio native builds

on:
  push:
    paths:
      - 'Packages/**'
      - 'App/**'
      - 'Tools/**'
      - '.github/workflows/snowfolio.yml'
  pull_request:
    paths:
      - 'Packages/**'
      - 'App/**'
      - 'Tools/**'
      - '.github/workflows/snowfolio.yml'
  workflow_dispatch:
    inputs:
      native_test_scope:
        description: Native UI test scope (focused diagnostics do not establish full acceptance)
        type: choice
        default: all
        options:
          - all
          - document-reload
          - document-lifecycle
          - document-restoration
          - document-host-probe
          - document-host-probe-url
          - document-host-probe-native
          - document-host-probe-workspace
          - document-host-probe-appkit
          - native-document-app
          - native-document-tabs
          - native-file-drops
          - native-document-groups
          - native-document-reading
          - native-writing-statistics
          - native-document-links
          - document-links
          - command-line
          - native-command-line
          - terminal-settings
          - native-terminal-settings
          - generic-documents
          - native-generic-documents
          - native-update-settings
          - native-plugins
          - native-document-scripting
          - native-voiceover
          - native-input-method
          - native-document-recovery
          - document-tab-creation

permissions:
  contents: read

jobs:
  swift-foundations:
    # Push/PR and default dispatch always retain the complete core/corpus gate.
    if: github.event_name != 'workflow_dispatch' || inputs.native_test_scope == 'all'
    # Native arm64 macOS 27 / Xcode 27 hosted image. See actions/runner-images.
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build, test and verify Apple Silicon output
        run: bash Tools/validate-modernization.sh "$RUNNER_TEMP/snowfolio-validation"
      - name: Check every published CommonMark example
        run: |
          curl --fail --silent --show-error --retry 3 https://spec.commonmark.org/0.31.2/spec.json -o "$RUNNER_TEMP/commonmark-spec.json"
          bash Tools/validate-commonmark.sh "$RUNNER_TEMP/commonmark-spec.json" "$RUNNER_TEMP/snowfolio-commonmark"
      - name: Preserve parser and package validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snowfolio-core-${{ github.sha }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/snowfolio-validation/*.log
            ${{ runner.temp }}/snowfolio-validation/*.txt
            ${{ runner.temp }}/snowfolio-commonmark/*.json
            ${{ runner.temp }}/snowfolio-commonmark/*.log

  native-app:
    runs-on: xcode-27
    # Full native-host parity includes all existing UI methods and artifact upload.
    # The8b1b28f regular run took28m56s before adding Terminal settings coverage.
    # Keep every method and behavioral deadline; budget the complete job separately.
    timeout-minutes: ${{ inputs.native_test_scope == 'native-document-app' && 45 || 35 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install verified project generator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Keep the tested generator stable; Homebrew's moving release download
          # repeatedly returned HTTP 504 before any native tests could execute.
          tool_dir="$RUNNER_TEMP/tuist-4.214.1"
          archive="$RUNNER_TEMP/tuist-4.214.1.zip"
          trap 'rm -f "$archive"' EXIT
          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 20 --max-time 180 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/tuist/tuist/releases/assets/691940861 \
            -o "$archive"
          echo "c9fb90582126d30380e9348da2c84d9c4ab08d59cded454f6bd8ef60bd93c759  $archive" | shasum -a 256 --check
          mkdir -p "$tool_dir"
          # Preserve the executable's adjacent framework and helper libraries.
          ditto -x -k "$archive" "$tool_dir"
          test "$("$tool_dir/tuist" version)" = 4.214.1
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Build native app and run document UI tests
        env:
          SNOWFOLIO_TEST_SCOPE: ${{ inputs.native_test_scope || 'all' }}
        run: |
          if [ "$SNOWFOLIO_TEST_SCOPE" = native-document-app ]; then
            TUIST_SNOWFOLIO_APPROVE_TEST_AUTOMATION=yes SNOWFOLIO_DOCUMENT_HOST=native bash Tools/build-snowfolio.sh --test
          elif [ "$SNOWFOLIO_TEST_SCOPE" = document-tab-creation ]; then
            bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testNewTabsUseKeyboardAndNativePlusWithoutReusingEmptyDocuments
          elif [ "$SNOWFOLIO_TEST_SCOPE" = native-document-recovery ]; then
            SNOWFOLIO_DOCUMENT_HOST=native bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testPeriodicDirtyConflictRevertKeepsExternalSource \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testPeriodicDirtyConflictSaveAnywayKeepsExternalVersion \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testPeriodicDirtyConflictSaveAsKeepsBothFiles \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testNativeVersionsBrowseAndRestoreExactPreviousBytes
          elif [ "$SNOWFOLIO_TEST_SCOPE" = native-update-settings ]; then
            SNOWFOLIO_DOCUMENT_HOST=native bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/UpdateSettingsTests
          elif [ "$SNOWFOLIO_TEST_SCOPE" = native-plugins ]; then
            SNOWFOLIO_DOCUMENT_HOST=native bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/PluginTests
          elif [ "$SNOWFOLIO_TEST_SCOPE" = native-input-method ]; then
            SNOWFOLIO_DOCUMENT_HOST=native bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/InputMethodTests
          elif [ "$SNOWFOLIO_TEST_SCOPE" = native-voiceover ]; then
            SNOWFOLIO_DOCUMENT_HOST=native bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/VoiceOverTests
          elif [ "$SNOWFOLIO_TEST_SCOPE" = native-document-scripting ]; then
            TUIST_SNOWFOLIO_APPROVE_TEST_AUTOMATION=yes SNOWFOLIO_DOCUMENT_HOST=native bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/DocumentScriptingTests
          elif [ "$SNOWFOLIO_TEST_SCOPE" = native-document-links ]; then
            SNOWFOLIO_DOCUMENT_HOST=native bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/DocumentLinksTests
          elif [ "$SNOWFOLIO_TEST_SCOPE" = document-links ]; then
            bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/DocumentLinksTests
          elif [ "$SNOWFOLIO_TEST_SCOPE" = native-command-line ]; then
            SNOWFOLIO_DOCUMENT_HOST=native bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/CommandLineTests
          elif [ "$SNOWFOLIO_TEST_SCOPE" = command-line ]; then
            bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/CommandLineTests
          elif [ "$SNOWFOLIO_TEST_SCOPE" = native-terminal-settings ]; then
            SNOWFOLIO_DOCUMENT_HOST=native bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/TerminalSettingsTests
          elif [ "$SNOWFOLIO_TEST_SCOPE" = terminal-settings ]; then
            bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/TerminalSettingsTests
          elif [ "$SNOWFOLIO_TEST_SCOPE" = native-generic-documents ]; then
            SNOWFOLIO_DOCUMENT_HOST=native bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/DocumentTypeTests
          elif [ "$SNOWFOLIO_TEST_SCOPE" = generic-documents ]; then
            bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/DocumentTypeTests
          elif [ "$SNOWFOLIO_TEST_SCOPE" = native-writing-statistics ]; then
            SNOWFOLIO_DOCUMENT_HOST=native bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testWritingStatisticsFollowManualRenderAndPreserveUndo
          elif [ "$SNOWFOLIO_TEST_SCOPE" = native-document-reading ]; then
            SNOWFOLIO_DOCUMENT_HOST=native bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testIndependentReadingPositionsSurviveQuitAndRelaunch
          elif [ "$SNOWFOLIO_TEST_SCOPE" = native-document-groups ]; then
            SNOWFOLIO_DOCUMENT_HOST=native bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testSeparateTabGroupsRestoreWithoutMergingDocuments
          elif [ "$SNOWFOLIO_TEST_SCOPE" = native-file-drops ]; then
            SNOWFOLIO_DOCUMENT_HOST=native bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/FileDropTests
          elif [ "$SNOWFOLIO_TEST_SCOPE" = native-document-tabs ]; then
            SNOWFOLIO_DOCUMENT_HOST=native bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testSavedTabsRestoreSelectedDocumentAndIndependentUndo \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testNewTabsUseKeyboardAndNativePlusWithoutReusingEmptyDocuments
          elif [ "$SNOWFOLIO_TEST_SCOPE" = document-host-probe-appkit ]; then
            SNOWFOLIO_DOCUMENT_HOST_PROBE_KIND=appkit bash Tools/probe-document-host.sh
          elif [ "$SNOWFOLIO_TEST_SCOPE" = document-host-probe-workspace ]; then
            SNOWFOLIO_DOCUMENT_HOST_PROBE_KIND=native-workspace bash Tools/probe-document-host.sh
          elif [ "$SNOWFOLIO_TEST_SCOPE" = document-host-probe-native ]; then
            SNOWFOLIO_DOCUMENT_HOST_PROBE_KIND=native bash Tools/probe-document-host.sh
          elif [ "$SNOWFOLIO_TEST_SCOPE" = document-host-probe-url ]; then
            SNOWFOLIO_DOCUMENT_HOST_PROBE_KIND=swiftui-url bash Tools/probe-document-host.sh
          elif [ "$SNOWFOLIO_TEST_SCOPE" = document-host-probe ]; then
            bash Tools/probe-document-host.sh
          elif [ "$SNOWFOLIO_TEST_SCOPE" = document-reload ]; then
            bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testAutosavePreservesEncodingAndReloadsCleanExternalChange \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testCoordinatedExternalReloadAfterAutosave
          elif [ "$SNOWFOLIO_TEST_SCOPE" = document-lifecycle ]; then
            bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testActiveAutosaveAndSavedEditUndoPreserveBytes \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testAutosavePreservesEncodingAndReloadsCleanExternalChange \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testCoordinatedExternalReloadAfterAutosave \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testCancelUnsavedDocumentCloseRetainsEditingAndUndo \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testGracefulQuitRestoresSavedDocumentAndInsertionPosition
          elif [ "$SNOWFOLIO_TEST_SCOPE" = document-restoration ]; then
            bash Tools/build-snowfolio.sh --test \
              --only-testing SnowfolioUITests/DocumentLifecycleTests/testGracefulQuitRestoresSavedDocumentAndInsertionPosition
          else
            bash Tools/build-snowfolio.sh --test
          fi
      - name: Capture focused launch metadata
        if: ${{ always() && (inputs.native_test_scope == 'native-document-links' || inputs.native_test_scope == 'document-links' || inputs.native_test_scope == 'command-line' || inputs.native_test_scope == 'native-command-line' || inputs.native_test_scope == 'native-file-drops') }}
        run: |
          /usr/bin/log show --last 5m --style compact --info --debug \
            --predicate 'eventMessage BEGINSWITH "SnowfolioDocument"' \
            > Build/Snowfolio/document-links.log 2>&1 || true
          /usr/bin/log show --last 5m --style compact --info --debug \
            --predicate '((subsystem == "com.apple.TCC" OR subsystem CONTAINS[c] "appleevent") AND eventMessage CONTAINS[c] "snowfolio") OR (eventMessage CONTAINS[c] "deny" AND eventMessage CONTAINS "local.snowfolio.cli.")' \
            > Build/Snowfolio/launch-permission-metadata.log 2>&1 || true
      - name: Preserve native UI test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snowfolio-native-${{ github.sha }}
          retention-days: 7
          path: |
            Build/DocumentHostProbe/*.log
            Build/DocumentHostProbe/DerivedData/Logs/Test/*.xcresult
            Build/Snowfolio/*.log
            Build/Snowfolio/DerivedData/Logs/Test/*.xcresult
